[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "technitium-dns-mcp"
version = "2.1.0"
description = "Technitium DNS Server MCP Server and Agent for Agentic AI!"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12, <3.15"
# NOTE (EH-484 policy update, see /var/tmp/l9/finish/au-decon-G4e/SDK-GAPS.md gap #0):
# agent-utilities is kept for kg_ingest.py's native_ingest import only -- the SDK's
# EG-client ingest facade does not exist yet, and native_ingest must keep working
# (no fail-closed stub). Drop agent-utilities once gap #0 lands.
dependencies = [
    "agent-connector-sdk>=0.1.0,<1.0.0", "agent-utilities>=2.0.0,<3.0.0",
]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0", ]

[project.scripts]
technitium-dns-mcp = "technitium_dns_mcp.mcp_server:mcp_server"

[project.entry-points."agent_utilities.skill_providers"]
technitium-dns-mcp = "technitium_dns_mcp.skills"

[project.entry-points."agent_utilities.ontology_providers"]
technitium-dns-mcp = "technitium_dns_mcp.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
technitium-dns-mcp = "technitium_dns_mcp.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
technitium-dns-mcp = "technitium_dns_mcp.prompts"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [ "pytest-timeout>=2.4.0", ]

[tool.setuptools.package-data]
technitium_dns_mcp = [ "mcp_config.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", ]
ignore = [ "E402", "E501", "B008", ]

[tool.setuptools.packages.find]
where = [ ".", ]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.0.0b1",
]

[tool.uv.sources]
agent-connector-sdk = { path = ".uv-workspace-siblings/agent-connector-sdk", editable = true }
agent-utilities = { path = ".uv-workspace-siblings/agent-utilities", editable = true }
